      de: "Starte das Jahr mit bis zu 110 Meteoren pro Stunde - Höhepunkt am 3./4. Januar."
      es: "Empieza el año con hasta 110 meteoros por hora: máximo la noche del 3 al 4 de enero."
      fr: "Commencez l'année avec jusqu'à 110 météores par heure - pic les 3-4 janvier."
      zh: "以每小时多达110颗流星开启新年——1月3日至4日夜间达到峰值。"
    longDescription:
      en: "The Quadrantids are one of the year's strongest meteor showers, but the peak lasts only a few hours on the night of January 3-4. Open the live sky view to find the radiant near the Big Dipper and the exact best viewing window for your location."
      de: "Die Quadrantiden gehören zu den stärksten Meteorströmen des Jahres, doch der Höhepunkt dauert nur wenige Stunden in der Nacht vom 3. auf den 4. Januar. Öffne die Live-Himmelsansicht, um den Radianten nahe dem Großen Wagen und die beste Beobachtungszeit für deinen Standort zu finden."
      es: "Las Cuadrántidas son una de las lluvias de meteoros más intensas del año, pero su máximo dura solo unas horas la noche del 3 al 4 de enero. Abre la vista del cielo en vivo para encontrar el radiante cerca de la Osa Mayor y tu mejor ventana de observación."
      fr: "Les Quadrantides comptent parmi les plus fortes pluies de météores de l'année, mais le pic ne dure que quelques heures dans la nuit du 3 au 4 janvier. Ouvrez la vue du ciel en direct pour trouver le radiant près de la Grande Ourse et votre meilleur créneau d'observation."
      zh: "象限仪座流星雨是年度最强的流星雨之一，但峰值仅持续数小时，出现在1月3日至4日夜间。打开实时星空视图，在北斗七星附近找到辐射点，查看您所在位置的最佳观测时间。"
