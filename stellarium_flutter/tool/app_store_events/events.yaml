# Astronomical in-app events for the App Store product page.
#
# Each entry becomes one App Store Connect in-app event. Dates are ISO 8601
# with timezone. Apple limits: max ~10 approved events, 5 published at once -
# the sync script only processes events whose publishStart is within
# --window-days (default 60) and warns if the approved-event budget is tight.
#
# badge: one of LIVE_EVENT | SPECIAL_EVENT | CHALLENGE | NEW_SEASON | PREMIERE | MAJOR_UPDATE
# purpose: one of ATTRACT_NEW_USERS | KEEP_ACTIVE_USERS | BRING_BACK_LAPSED_USERS | NOTIFY_IMPORTANT_UPDATE
#
# VERIFY the astronomy dates before submitting - these are examples.

defaults:
  badge: LIVE_EVENT
  # Broadest audience - shown to existing users on the product page too.
  # ATTRACT_NEW_USERS restricts the card to non-users (search/browse only).
  purpose: APPROPRIATE_FOR_ALL_USERS
  priority: HIGH
  deepLink: "starguide://screen/sky"
  # Style prompt appended to every image prompt for a consistent look
  imageStyle: >-
    photorealistic wide-angle night sky photography, deep blues and blacks,
    no text, no logos, no people in the foreground, cinematic, awe-inspiring

events:
  - id: perseids-2026
    name:
      en: "Perseid Meteor Shower"
      de: "Perseiden-Sternschnuppen"
      es: "Lluvia de Perseidas"
      fr: "Pluie des Perséides"
      zh: "英仙座流星雨"
    shortDescription:
      en: "Up to 100 shooting stars per hour - find the best viewing time for your location."
      de: "Bis zu 100 Sternschnuppen pro Stunde - finde die beste Zeit für deinen Standort."
      es: "Hasta 100 estrellas fugaces por hora: encuentra la mejor hora para tu ubicación."
      fr: "Jusqu'à 100 étoiles filantes par heure - trouvez le meilleur moment pour votre position."
      zh: "每小时多达100颗流星——查找您所在位置的最佳观测时间。"
    longDescription:
      en: "The Perseids peak on the night of August 12-13. Open the live sky view to see where the radiant rises above your horizon and get the best viewing window for your exact location."
      de: "Die Perseiden erreichen ihren Höhepunkt in der Nacht vom 12. auf den 13. August. Öffne die Live-Himmelsansicht, um zu sehen, wo der Radiant über deinem Horizont aufgeht."
      es: "Las Perseidas alcanzan su máximo la noche del 12 al 13 de agosto. Abre la vista del cielo en vivo para ver dónde sale el radiante sobre tu horizonte."
      fr: "Les Perséides culminent dans la nuit du 12 au 13 août. Ouvrez la vue du ciel en direct pour voir où le radiant se lève au-dessus de votre horizon."
      zh: "英仙座流星雨将于8月12日至13日夜间达到峰值。打开实时星空视图，查看辐射点在您地平线上升起的位置。"
    publishStart: "2026-07-29T00:00:00Z"
    eventStart: "2026-08-11T20:00:00Z"
    eventEnd: "2026-08-14T06:00:00Z"
    imagePrompt: >-
      A meteor shower over a mountain lake at night, several bright meteor
      streaks radiating from one point in a star-filled sky, Milky Way visible

  - id: solar-eclipse-2026
    name:
      en: "Total Solar Eclipse"
      de: "Totale Sonnenfinsternis"
      es: "Eclipse Solar Total"
      fr: "Éclipse Solaire Totale"
      zh: "日全食"
    shortDescription:
      en: "A total solar eclipse crosses Europe on August 12 - track it live in the app."
      de: "Am 12. August zieht eine totale Sonnenfinsternis über Europa - verfolge sie live."
      es: "Un eclipse solar total cruza Europa el 12 de agosto: síguelo en directo."
      fr: "Une éclipse solaire totale traverse l'Europe le 12 août - suivez-la en direct."
      zh: "8月12日日全食横跨欧洲——在应用中实时追踪。"
    longDescription:
      en: "On August 12, 2026 a total solar eclipse is visible from Iceland and Spain, with a deep partial eclipse across Europe. See exactly how much of the sun is covered from your location and when."
      de: "Am 12. August 2026 ist eine totale Sonnenfinsternis von Island und Spanien aus sichtbar, mit einer starken partiellen Finsternis in ganz Europa. Sieh genau, wie viel der Sonne an deinem Standort bedeckt wird."
      es: "El 12 de agosto de 2026 un eclipse solar total será visible desde Islandia y España, con un eclipse parcial profundo en toda Europa. Mira exactamente cuánto sol se cubre desde tu ubicación."
      fr: "Le 12 août 2026, une éclipse solaire totale sera visible depuis l'Islande et l'Espagne, avec une éclipse partielle profonde dans toute l'Europe. Voyez exactement quelle part du soleil est couverte depuis votre position."
      zh: "2026年8月12日，冰岛和西班牙可见日全食，欧洲大部分地区可见深度日偏食。查看您所在位置的日食覆盖程度和时间。"
    publishStart: "2026-07-22T00:00:00Z"
    eventStart: "2026-08-12T15:00:00Z"
    eventEnd: "2026-08-12T21:00:00Z"
    imagePrompt: >-
      A total solar eclipse at the moment of totality, black moon disk with a
      glowing white corona, dark blue twilight sky, silhouetted landscape below

  - id: geminids-2026
    name:
      en: "Geminid Meteor Shower"
      de: "Geminiden-Sternschnuppen"
      es: "Lluvia de Gemínidas"
      fr: "Pluie des Géminides"
      zh: "双子座流星雨"
    shortDescription:
      en: "The year's strongest meteor shower peaks December 13-14."
      de: "Der stärkste Meteorstrom des Jahres - Höhepunkt am 13./14. Dezember."
      es: "La lluvia de meteoros más intensa del año alcanza su máximo el 13-14 de diciembre."
      fr: "La plus forte pluie de météores de l'année culmine les 13-14 décembre."
      zh: "年度最强流星雨将于12月13日至14日达到峰值。"
    longDescription:
      en: "The Geminids deliver up to 150 meteors per hour under dark skies. Open the app to find the radiant in Gemini and check the best viewing hours for your location."
      de: "Die Geminiden liefern unter dunklem Himmel bis zu 150 Meteore pro Stunde. Öffne die App, um den Radianten in den Zwillingen zu finden und die besten Beobachtungszeiten zu sehen."
      es: "Las Gemínidas ofrecen hasta 150 meteoros por hora bajo cielos oscuros. Abre la app para encontrar el radiante en Géminis y consultar las mejores horas."
      fr: "Les Géminides offrent jusqu'à 150 météores par heure sous un ciel sombre. Ouvrez l'app pour trouver le radiant dans les Gémeaux et les meilleures heures d'observation."
      zh: "在黑暗的天空下，双子座流星雨每小时可产生多达150颗流星。打开应用，在双子座中找到辐射点。"
    publishStart: "2026-11-30T00:00:00Z"
    eventStart: "2026-12-13T18:00:00Z"
    eventEnd: "2026-12-15T06:00:00Z"
    imagePrompt: >-
      A winter meteor shower over a snowy pine forest at night, bright meteor
      streaks in a crisp star-filled sky, Orion constellation visible

  - id: comet-tempel-2026
    name:
      en: "Comet Tempel Passes By!"
      de: "Komet Tempel zieht vorbei!"
      es: "¡El cometa Tempel pasa cerca!"
      fr: "La comète Tempel passe près de nous !"
      zh: "坦普尔彗星飞掠而过！"
    shortDescription:
      en: "Comet 10P/Tempel 2 makes its closest pass on August 3 - find it in your sky."
      de: "Komet 10P/Tempel 2 ist am 3. August der Erde am nächsten - finde ihn am Himmel."
      es: "El cometa 10P/Tempel 2 hace su máximo acercamiento el 3 de agosto: encuéntralo."
      fr: "La comète 10P/Tempel 2 est au plus près de la Terre le 3 août - trouvez-la."
      zh: "坦普尔2号彗星将于8月3日最接近地球——在星空中找到它。"
    longDescription:
      en: "Comet 10P/Tempel 2 reaches perihelion on August 2 and passes closest to Earth a day later. At magnitude 8-10 it's a great binocular target - open the live sky view to see exactly where to look from your location."
      de: "Komet 10P/Tempel 2 erreicht am 2. August sein Perihel und passiert einen Tag später die Erde. Mit Magnitude 8-10 ist er ein tolles Fernglas-Ziel - öffne die Live-Himmelsansicht, um zu sehen, wo du suchen musst."
      es: "El cometa 10P/Tempel 2 alcanza el perihelio el 2 de agosto y pasa más cerca de la Tierra un día después. Con magnitud 8-10 es un gran objetivo para binoculares: abre la vista del cielo en vivo para saber dónde mirar."
      fr: "La comète 10P/Tempel 2 atteint son périhélie le 2 août et passe au plus près de la Terre un jour plus tard. De magnitude 8-10, c'est une belle cible aux jumelles - ouvrez la vue du ciel en direct pour savoir où regarder."
      zh: "坦普尔2号彗星将于8月2日到达近日点，一天后最接近地球。亮度8-10等，是双筒望远镜的绝佳目标——打开实时星空视图，查看您所在位置的观测方向。"
    publishStart: "2026-07-20T00:00:00Z"
    eventStart: "2026-07-20T00:00:00Z"
    eventEnd: "2026-08-03T23:59:00Z"
    imagePrompt: >-
