      de: "Ursiden-Sternschnuppen"
      es: "Lluvia de Úrsidas"
      fr: "Pluie des Ursides"
      zh: "小熊座流星雨"
    shortDescription:
      en: "The year's last meteor shower peaks December 22 - catch it near the Little Dipper."
      de: "Der letzte Meteorstrom des Jahres - Höhepunkt am 22. Dezember beim Kleinen Wagen."
      es: "La última lluvia de meteoros del año alcanza su máximo el 22 de diciembre."
      fr: "La dernière pluie de météores de l'année culmine le 22 décembre."
      zh: "年度最后一场流星雨将于12月22日达到峰值——在小北斗附近观测。"
    longDescription:
      en: "The Ursids peak on the night of December 22-23, radiating from the Little Dipper near Polaris. Around 10 meteors per hour under dark skies - open the live sky view to find the radiant and the best viewing window for your location."
      de: "Die Ursiden erreichen ihren Höhepunkt in der Nacht vom 22. auf den 23. Dezember, mit Radiant im Kleinen Wagen nahe dem Polarstern. Rund 10 Meteore pro Stunde unter dunklem Himmel - öffne die Live-Himmelsansicht für die beste Beobachtungszeit."
      es: "Las Úrsidas alcanzan su máximo la noche del 22 al 23 de diciembre, con el radiante en la Osa Menor cerca de la Polar. Unos 10 meteoros por hora bajo cielos oscuros: abre la vista del cielo en vivo para encontrar el mejor momento."
      fr: "Les Ursides culminent dans la nuit du 22 au 23 décembre, avec un radiant dans la Petite Ourse près de l'étoile Polaire. Environ 10 météores par heure sous un ciel sombre - ouvrez la vue du ciel en direct pour trouver le meilleur créneau."
      zh: "小熊座流星雨将于12月22日至23日夜间达到峰值，辐射点位于北极星附近的小熊座。黑暗天空下每小时约10颗流星——打开实时星空视图，查找最佳观测时间。"
